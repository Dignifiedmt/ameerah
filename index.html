    // Helper for LocalStorage
    const useLocalStorage = (key, initialValue) => {
      const [storedValue, setStoredValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (error) {
          console.warn(`Error reading localStorage key "${key}":`, error);
          return initialValue;
        }
      });

      const setValue = (value) => {
        try {
          const valueToStore = value instanceof Function ? value(storedValue) : value;
          setStoredValue(valueToStore);
          window.localStorage.setItem(key, JSON.stringify(valueToStore));
        } catch (error) {
          console.warn(`Error setting localStorage key "${key}":`, error);
        }
      };

      return [storedValue, setValue];
    };

      const [formData, setFormData] = useState({
        name: "Alex Seeker",
        email: "alex.seeker@example.com",
        phone: "+1 (555) 987-6543",
        linkedin: "https://linkedin.com/in/alexseeker",
        experienceYears: 4,
        expectedSalary: job ? job.salaryMin + 10000 : 120000,
        coverLetter: "I am excited to submit my application for this role. With my background in high-velocity teams and passion for quality software craft, I can make an immediate positive contribution to the team.",
        resumeName: "Alex_Seeker_Resume.pdf"
      });

      const [fileName, setFileName] = useState("Alex_Seeker_Resume_2026.pdf");
      const [fileSize, setFileSize] = useState("1.8 MB");
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [errors, setErrors] = useState({});

      if (!job) return null;

      const handleFileChange = (e) => {
        if (e.target.files && e.target.files[0]) {
          const file = e.target.files[0];
          setFileName(file.name);
          setFileSize((file.size / (1024 * 1024)).toFixed(1) + " MB");
          setFormData({ ...formData, resumeName: file.name });
        }
      };

      const validate = () => {
        const errs = {};
        if (!formData.name.trim()) errs.name = "Full name is required";
        if (!formData.email.trim() || !formData.email.includes('@')) errs.email = "Valid email is required";
        if (!formData.phone.trim()) errs.phone = "Phone number is required";
        if (!formData.coverLetter.trim()) errs.coverLetter = "Cover letter or brief note is required";
        setErrors(errs);
        return Object.keys(errs).length === 0;
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!validate()) return;

        setIsSubmitting(true);
        setTimeout(() => {
          const newApplication = {
            id: "app-" + Date.now(),
            jobId: job.id,
            jobTitle: job.title,
            company: job.company,
            applicantName: formData.name,
            email: formData.email,
            phone: formData.phone,
            linkedin: formData.linkedin,
            experienceYears: Number(formData.experienceYears),
            expectedSalary: Number(formData.expectedSalary),
            coverLetter: formData.coverLetter,
            resumeName: fileName || "Resume.pdf",
            status: "Applied",
            appliedDate: new Date().toISOString().split('T')[0],
            notes: "Candidate applied via portal. Automatic initial triage pending."
          };

          setIsSubmitting(false);
          onSubmitSuccess(newApplication);
        }, 600);
      };

      return (
        <div className="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6 animate-fade-in">
          <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[92vh] flex flex-col shadow-2xl border border-brand-200 overflow-hidden">
            
            {/* Header */}
            <div className="p-6 bg-gradient-to-r from-brand-50 to-purple-50 border-b border-brand-100 flex items-center justify-between">
              <div>
                <span className="text-xs font-semibold badge-purple px-2.5 py-0.5 rounded-full">
                  Job Application
                </span>
                <h2 className="text-xl font-bold text-slate-900 mt-1">
                  Applying for {job.title}
                </h2>
                <p className="text-xs text-slate-500">at {job.company} • {job.location}</p>
              </div>
              <button
                onClick={onClose}
                className="p-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition"
              >
                <IconX className="w-5 h-5" />
              </button>
            </div>

            {/* Form */}
            <form onSubmit={handleSubmit} className="p-6 overflow-y-auto space-y-4 text-slate-700 text-sm flex-1">
              
              {/* Full Name & Email */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">
                    Full Name <span className="text-rose-500">*</span>
                  </label>
                  <input
                    type="text"
                    value={formData.name}
                    onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                    className={`w-full px-3.5 py-2.5 rounded-xl border text-sm outline-none transition focus:ring-2 focus:ring-brand-400 ${
                      errors.name ? 'border-rose-300 bg-rose-50' : 'border-slate-200 bg-slate-50/50'
                    }`}
                    placeholder="e.g. Jane Doe"
                  />
                  {errors.name && <p className="text-[11px] text-rose-500 mt-1">{errors.name}</p>}
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">
                    Email Address <span className="text-rose-500">*</span>
                  </label>
                  <input
                    type="email"
                    value={formData.email}
                    onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                    className={`w-full px-3.5 py-2.5 rounded-xl border text-sm outline-none transition focus:ring-2 focus:ring-brand-400 ${
                      errors.email ? 'border-rose-300 bg-rose-50' : 'border-slate-200 bg-slate-50/50'
                    }`}
                    placeholder="jane@example.com"
                  />
                  {errors.email && <p className="text-[11px] text-rose-500 mt-1">{errors.email}</p>}
                </div>
              </div>

              {/* Phone & LinkedIn / Portfolio */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">
                    Phone Number <span className="text-rose-500">*</span>
                  </label>
                  <input
                    type="tel"
                    value={formData.phone}
                    onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                    className={`w-full px-3.5 py-2.5 rounded-xl border text-sm outline-none transition focus:ring-2 focus:ring-brand-400 ${
                      errors.phone ? 'border-rose-300 bg-rose-50' : 'border-slate-200 bg-slate-50/50'
                    }`}
                    placeholder="+1 (555) 000-0000"
                  />
                  {errors.phone && <p className="text-[11px] text-rose-500 mt-1">{errors.phone}</p>}
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">
                    LinkedIn / Portfolio URL
                  </label>
                  <input
                    type="url"
                    value={formData.linkedin}
                    onChange={(e) => setFormData({ ...formData, linkedin: e.target.value })}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-sm outline-none transition focus:ring-2 focus:ring-brand-400"
                    placeholder="https://linkedin.com/in/username"
                  />
                </div>
              </div>

              {/* Experience Years & Expected Salary */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">
                    Relevant Experience (Years)
                  </label>
                  <input
                    type="number"
                    min="0"
                    max="40"
                    value={formData.experienceYears}
                    onChange={(e) => setFormData({ ...formData, experienceYears: e.target.value })}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-sm outline-none transition focus:ring-2 focus:ring-brand-400"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">
                    Desired Salary (USD / yr)
                  </label>
                  <input
                    type="number"
                    step="5000"
                    value={formData.expectedSalary}
                    onChange={(e) => setFormData({ ...formData, expectedSalary: e.target.value })}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-sm outline-none transition focus:ring-2 focus:ring-brand-400"
                  />
                </div>
              </div>

              {/* Resume Upload Simulator */}
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">
                  Resume / CV (PDF or DOCX)
                </label>
                <div className="border-2 border-dashed border-brand-200 hover:border-brand-400 rounded-2xl p-4 bg-brand-50/30 transition flex flex-col items-center justify-center text-center cursor-pointer relative">
                  <input
                    type="file"
                    accept=".pdf,.doc,.docx"
                    onChange={handleFileChange}
                    className="absolute inset-0 opacity-0 cursor-pointer"
                  />
                  <div className="w-10 h-10 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center mb-2">
                    <IconUpload className="w-5 h-5" />
                  </div>
                  <p className="text-xs font-semibold text-slate-800">
                    {fileName ? fileName : "Click to upload or drag & drop resume"}
                  </p>
                  <p className="text-[11px] text-slate-500 mt-0.5">
                    {fileName ? `${fileSize} • Uploaded Ready` : "PDF, DOCX up to 10MB"}
                  </p>
                </div>
              </div>

              {/* Cover Letter */}
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">
                  Cover Letter / Note to Hiring Manager <span className="text-rose-500">*</span>
                </label>
                <textarea
                  rows="4"
                  value={formData.coverLetter}
                  onChange={(e) => setFormData({ ...formData, coverLetter: e.target.value })}
                  className={`w-full px-3.5 py-2.5 rounded-xl border text-sm outline-none transition focus:ring-2 focus:ring-brand-400 ${
                    errors.coverLetter ? 'border-rose-300 bg-rose-50' : 'border-slate-200 bg-slate-50/50'
                  }`}
                  placeholder="Share why you're interested in this role and what makes you a great fit..."
                ></textarea>
                {errors.coverLetter && <p className="text-[11px] text-rose-500 mt-1">{errors.coverLetter}</p>}
              </div>

              {/* Footer */}
              <div className="pt-4 border-t border-brand-100 flex items-center justify-end gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2.5 rounded-xl text-sm font-medium text-slate-600 hover:bg-slate-100 transition"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  disabled={isSubmitting}
                  className="gradient-purple-btn text-white text-sm font-semibold px-6 py-2.5 rounded-xl shadow-purple-sm flex items-center gap-2"
                >
                  {isSubmitting ? (
                    <span>Submitting Application...</span>
                  ) : (
                    <>
                      <IconSend className="w-4 h-4" />
                      <span>Submit Application</span>
                    </>
                  )}
                </button>
              </div>

            </form>

          </div>
        </div>
      );
    };

    // ==========================================
    // MY APPLICATIONS (USER TRACKER)
    // ==========================================
    const MyApplications = ({ applications, onWithdraw, onViewDetails }) => {
      if (applications.length === 0) {
        return (
          <div className="max-w-4xl mx-auto py-16 px-4 text-center">
            <div className="w-16 h-16 rounded-3xl bg-brand-100 text-brand-600 flex items-center justify-center mx-auto mb-4 shadow-purple-sm">
              <IconFileText className="w-8 h-8" />
            </div>
            <h3 className="text-xl font-bold text-slate-800">No applications submitted yet</h3>
            <p className="text-slate-500 text-sm mt-1 max-w-md mx-auto">
              Explore available job postings, submit your resume, and track interview progress right from this dashboard.
            </p>
          </div>
        );
      }

      return (
        <div className="max-w-6xl mx-auto py-8 px-4 sm:px-6">
          <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
            <div>
              <h2 className="text-2xl font-bold text-slate-900">My Job Applications</h2>
              <p className="text-sm text-slate-500 mt-0.5">
                Track status, review notes, and monitor your candidate journey in real time.
              </p>
            </div>
            <span className="px-3 py-1 rounded-full badge-purple text-xs font-semibold">
              {applications.length} Active Application{applications.length > 1 ? 's' : ''}
            </span>
          </div>

          <div className="space-y-4">
            {applications.map((app) => {
              const step = getStatusStep(app.status);
              return (
                <div key={app.id} className="bg-white rounded-2xl border border-brand-100 p-6 shadow-purple-sm hover:shadow-purple-md transition">
                  <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 pb-5 border-b border-brand-50">
                    <div>
                      <div className="flex items-center gap-3">
                        <h3 className="text-lg font-bold text-slate-900">{app.jobTitle}</h3>
                        <span className={`text-xs px-2.5 py-1 rounded-full border ${getStatusStyle(app.status)}`}>
                          {app.status}
                        </span>
                      </div>
                      <div className="flex items-center gap-3 text-xs text-slate-500 mt-1">
                        <span className="font-semibold text-slate-700">{app.company}</span>
                        <span>•</span>
                        <span>Applied on {app.appliedDate}</span>
                        <span>•</span>
                        <span>Salary: {formatCurrency(app.expectedSalary)}/yr</span>
                      </div>
                    </div>

                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => onViewDetails(app)}
                        className="text-xs font-semibold text-brand-700 bg-brand-50 hover:bg-brand-100 px-3 py-1.5 rounded-lg border border-brand-200 transition"
                      >
                        View Submission
                      </button>
                      <button
                        onClick={() => onWithdraw(app.id)}
                        className="text-xs font-semibold text-rose-600 hover:bg-rose-50 px-3 py-1.5 rounded-lg border border-rose-200 transition"
                      >
                        Withdraw
                      </button>
                    </div>
                  </div>

                  {/* Visual Progress Stepper */}
                  <div className="mt-5">
                    <div className="grid grid-cols-4 gap-2 text-center text-xs font-semibold">
                      
                      {/* Step 1: Applied */}
                      <div className="flex flex-col items-center">
                        <div className={`w-8 h-8 rounded-full flex items-center justify-center mb-1.5 ${
                          step >= 1 ? 'bg-brand-600 text-white shadow-purple-sm' : 'bg-slate-100 text-slate-400'
                        }`}>
                          <IconCheckCircle className="w-4 h-4" />
                        </div>
                        <span className={step >= 1 ? 'text-brand-800' : 'text-slate-400'}>Applied</span>
                      </div>

                      {/* Step 2: Under Review */}
                      <div className="flex flex-col items-center">
                        <div className={`w-8 h-8 rounded-full flex items-center justify-center mb-1.5 ${
                          step >= 2 ? 'bg-brand-600 text-white shadow-purple-sm' : 'bg-slate-100 text-slate-400'
                        }`}>
                          <IconSearch className="w-4 h-4" />
                        </div>
                        <span className={step >= 2 ? 'text-brand-800' : 'text-slate-400'}>Under Review</span>
                      </div>

                      {/* Step 3: Interviewing */}
                      <div className="flex flex-col items-center">
                        <div className={`w-8 h-8 rounded-full flex items-center justify-center mb-1.5 ${
                          step >= 3 ? 'bg-brand-600 text-white shadow-purple-sm' : 'bg-slate-100 text-slate-400'
                        }`}>
                          <IconUsers className="w-4 h-4" />
                        </div>
                        <span className={step >= 3 ? 'text-brand-800' : 'text-slate-400'}>Interviewing</span>
                      </div>

                      {/* Step 4: Decision */}
                      <div className="flex flex-col items-center">
                        <div className={`w-8 h-8 rounded-full flex items-center justify-center mb-1.5 ${
                          step >= 4
                            ? app.status === 'Offered'
                              ? 'bg-emerald-600 text-white'
                              : 'bg-rose-600 text-white'
                            : 'bg-slate-100 text-slate-400'
                        }`}>
                          <IconSparkles className="w-4 h-4" />
                        </div>
                        <span className={step >= 4 ? 'text-slate-900 font-bold' : 'text-slate-400'}>
                          {app.status === 'Offered' ? 'Offer Extended!' : app.status === 'Rejected' ? 'Closed' : 'Offer / Decision'}
                        </span>
                      </div>

                    </div>

                    {/* Progress Bar Line */}
                    <div className="w-full bg-slate-100 h-1.5 rounded-full mt-3 overflow-hidden">
                      <div
                        className="bg-gradient-to-r from-brand-500 to-purple-600 h-full transition-all duration-500"
                        style={{ width: `${(step / 4) * 100}%` }}
                      ></div>
                    </div>
                  </div>

                  {/* Feedback / Admin Note if present */}
                  {app.notes && (
                    <div className="mt-4 p-3 bg-brand-50/50 rounded-xl border border-brand-100 text-xs text-slate-600 flex items-start gap-2">
                      <IconSparkles className="w-4 h-4 text-brand-600 flex-shrink-0 mt-0.5" />
                      <div>
                        <span className="font-semibold text-brand-800">Recruiter Update: </span>
                        <span>{app.notes}</span>
                      </div>
                    </div>
                  )}

                </div>
              );
            })}
          </div>
        </div>
      );
    };

    // ==========================================
    // ADMIN DASHBOARD & POSTINGS MANAGEMENT
    // ==========================================
    const AdminDashboard = ({
      jobs,
      applications,
      onOpenPostModal,
      onOpenEditModal,
      onDeleteJob,
      onToggleJobStatus,
      onViewApplicantsForJob
    }) => {
      const stats = useMemo(() => {
        const activeCount = jobs.filter(j => j.status === 'Active').length;
        const totalApps = applications.length;
        const interviewingCount = applications.filter(a => a.status === 'Interviewing').length;
        const offeredCount = applications.filter(a => a.status === 'Offered').length;
        return { activeCount, totalApps, interviewingCount, offeredCount };
      }, [jobs, applications]);

      return (
        <div className="max-w-7xl mx-auto py-8 px-4 sm:px-6">
          
          {/* Top Analytics KPI Cards */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div className="bg-white p-5 rounded-2xl border border-brand-100 shadow-purple-sm">
              <span className="text-xs font-semibold text-slate-500">Active Job Postings</span>
              <div className="flex items-center justify-between mt-2">
                <span className="text-3xl font-extrabold text-brand-700">{stats.activeCount}</span>
                <div className="w-10 h-10 rounded-xl bg-brand-100 text-brand-600 flex items-center justify-center">
                  <IconBriefcase className="w-5 h-5" />
                </div>
              </div>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-brand-100 shadow-purple-sm">
              <span className="text-xs font-semibold text-slate-500">Total Applicants</span>
              <div className="flex items-center justify-between mt-2">
                <span className="text-3xl font-extrabold text-purple-800">{stats.totalApps}</span>
                <div className="w-10 h-10 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center">
                  <IconUsers className="w-5 h-5" />
                </div>
              </div>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-brand-100 shadow-purple-sm">
              <span className="text-xs font-semibold text-slate-500">In Interview Stage</span>
              <div className="flex items-center justify-between mt-2">
                <span className="text-3xl font-extrabold text-indigo-700">{stats.interviewingCount}</span>
                <div className="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-600 flex items-center justify-center">
                  <IconClock className="w-5 h-5" />
                </div>
              </div>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-brand-100 shadow-purple-sm">
              <span className="text-xs font-semibold text-slate-500">Offers Extended</span>
              <div className="flex items-center justify-between mt-2">
                <span className="text-3xl font-extrabold text-emerald-600">{stats.offeredCount}</span>
                <div className="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center">
                  <IconSparkles className="w-5 h-5" />
                </div>
              </div>
            </div>
          </div>

          {/* Job Postings Table Section */}
          <div className="bg-white rounded-3xl border border-brand-100 shadow-purple-sm overflow-hidden">
            <div className="p-6 border-b border-brand-100 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
              <div>
                <h2 className="text-xl font-bold text-slate-900">Job Postings Management</h2>
                <p className="text-xs text-slate-500 mt-0.5">
                  Publish, update, or archive role listings and view incoming applicants.
                </p>
              </div>
              <button
                onClick={onOpenPostModal}
                className="gradient-purple-btn text-white text-sm font-semibold px-4 py-2.5 rounded-xl shadow-purple-sm flex items-center gap-2"
              >
                <IconPlus className="w-4 h-4" />
                <span>Create New Job</span>
              </button>
            </div>

            {/* Table */}
            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm text-slate-600">
                <thead className="bg-brand-50/60 text-slate-700 font-semibold text-xs uppercase tracking-wider border-b border-brand-100">
                  <tr>
                    <th className="px-6 py-4">Job Role & Company</th>
                    <th className="px-6 py-4">Department & Type</th>
                    <th className="px-6 py-4">Salary Range</th>
                    <th className="px-6 py-4">Applicants</th>
                    <th className="px-6 py-4">Status</th>
                    <th className="px-6 py-4 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-brand-50">
                  {jobs.map((job) => {
                    const applicantCount = applications.filter(a => a.jobId === job.id).length;
                    return (
                      <tr key={job.id} className="hover:bg-brand-50/40 transition">
                        <td className="px-6 py-4">
                          <div className="font-bold text-slate-900">{job.title}</div>
                          <div className="text-xs text-slate-500">{job.company} • {job.location}</div>
                        </td>
                        <td className="px-6 py-4">
                          <span className="font-medium text-slate-800">{job.department}</span>
                          <span className="block text-xs text-slate-400">{job.type} ({job.workplaceType})</span>
                        </td>
                        <td className="px-6 py-4 font-semibold text-slate-800">
                          {formatCurrency(job.salaryMin)} - {formatCurrency(job.salaryMax)}
                        </td>
                        <td className="px-6 py-4">
                          <button
                            onClick={() => onViewApplicantsForJob(job.id)}
                            className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-brand-100 text-brand-800 hover:bg-brand-200 transition"
                          >
                            <IconUsers className="w-3.5 h-3.5" />
                            <span>{applicantCount} Applicant{applicantCount !== 1 ? 's' : ''}</span>
                          </button>
                        </td>
                        <td className="px-6 py-4">
                          <button
                            onClick={() => onToggleJobStatus(job.id)}
                            className={`px-2.5 py-1 rounded-full text-xs font-semibold cursor-pointer border transition ${
                              job.status === 'Active'
                                ? 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100'
                                : 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200'
                            }`}
                            title="Click to toggle status"
                          >
                            {job.status}
                          </button>
                        </td>
                        <td className="px-6 py-4 text-right space-x-2">
                          <button
                            onClick={() => onOpenEditModal(job)}
                            className="p-1.5 rounded-lg text-slate-400 hover:text-brand-600 hover:bg-brand-50 transition"
                            title="Edit Job"
                          >
                            <IconEdit className="w-4 h-4" />
                          </button>
                          <button
                            onClick={() => onDeleteJob(job.id)}
                            className="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition"
                            title="Delete Job"
                          >
                            <IconTrash className="w-4 h-4" />
                          </button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

          </div>

        </div>

      const [selectedType, setSelectedType] = useState('All');
      const [selectedExp, setSelectedExp] = useState('All');

      const [adminFilterJobId, setAdminFilterJobId] = useState('All');

      // Modals
      const [selectedJobForDetail, setSelectedJobForDetail] = useState(null);
      const [selectedJobForApply, setSelectedJobForApply] = useState(null);
      const [isPostModalOpen, setIsPostModalOpen] = useState(false);
      const [editingJob, setEditingJob] = useState(null);

      // Toast Notification
      const [toast, setToast] = useState(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
      };

      // Reset Demo Data
      const handleResetData = () => {
        if (window.confirm("Reset all jobs and applications to initial demo state?")) {
          setJobs(INITIAL_JOBS);
          setApplications(INITIAL_APPLICATIONS);
          setSavedJobIds(['job-1']);
          showToast("Sample demo data restored!");
        }
      };

      // Bookmark / Save toggle
      const handleToggleSave = (jobId) => {
        setSavedJobIds(prev => {
          if (prev.includes(jobId)) {
            showToast("Job removed from saved list");
            return prev.filter(id => id !== jobId);
          } else {
            showToast("Job saved to your bookmarks!");
            return [...prev, jobId];
          }
        });
      };

      // Apply Handler
      const handleApplySuccess = (newApp) => {
        setApplications(prev => [newApp, ...prev]);
        setSelectedJobForApply(null);
        showToast("Application submitted successfully! You can track it in 'My Applications'.");
        setActiveTab('applications');
      };

      // Withdraw Application
      const handleWithdraw = (appId) => {
        if (window.confirm("Are you sure you want to withdraw this job application?")) {
          setApplications(prev => prev.filter(a => a.id !== appId));
          showToast("Application withdrawn.");
        }
      };

      // Admin: Save or update job
      const handleSaveJob = (jobToSave) => {
        if (editingJob) {
          setJobs(prev => prev.map(j => j.id === jobToSave.id ? jobToSave : j));
          showToast(`Job "${jobToSave.title}" updated successfully.`);
        } else {
          setJobs(prev => [jobToSave, ...prev]);
          showToast(`New job "${jobToSave.title}" published!`);
        }
        setIsPostModalOpen(false);
        setEditingJob(null);
      };

      // Admin: Delete job
      const handleDeleteJob = (jobId) => {
        if (window.confirm("Delete this job posting permanently?")) {
          setJobs(prev => prev.filter(j => j.id !== jobId));
          showToast("Job posting deleted.");
        }
      };

      // Admin: Toggle Job Status (Active <-> Paused)
      const handleToggleJobStatus = (jobId) => {
        setJobs(prev => prev.map(j => {
          if (j.id === jobId) {
            const nextStatus = j.status === 'Active' ? 'Paused' : 'Active';
            showToast(`Job status set to ${nextStatus}`);
            return { ...j, status: nextStatus };
          }
          return j;
        }));
      };

      // Admin: Update applicant status
      const handleUpdateApplicantStatus = (appId, newStatus) => {
        setApplications(prev => prev.map(a => {
          if (a.id === appId) {
            return { ...a, status: newStatus };
          }
          return a;
        }));
        showToast(`Candidate stage updated to: ${newStatus}`);
      };

      // Admin: Update applicant notes
      const handleUpdateApplicantNotes = (appId, notes) => {
        setApplications(prev => prev.map(a => a.id === appId ? { ...a, notes } : a));
      };

      // Admin: Delete applicant
      const handleDeleteApplicant = (appId) => {
        if (window.confirm("Remove candidate application?")) {
          setApplications(prev => prev.filter(a => a.id !== appId));
          showToast("Candidate removed.");
        }
      };

      // Filtered Jobs for Seeker
      const filteredJobs = useMemo(() => {
        return jobs.filter(job => {
          // If in seeker mode, hide paused/closed jobs
          if (role === 'user' && job.status !== 'Active') return false;

          const query = searchQuery.toLowerCase().trim();
          const matchQuery = !query || 
            job.title.toLowerCase().includes(query) ||
            job.company.toLowerCase().includes(query) ||
            job.location.toLowerCase().includes(query) ||
            (job.skills && job.skills.some(s => s.toLowerCase().includes(query)));

          const matchDept = selectedDept === 'All' || job.department === selectedDept;
          const matchType = selectedType === 'All' || job.type === selectedType || job.workplaceType === selectedType;
          const matchExp = selectedExp === 'All' || job.experience === selectedExp;

          return matchQuery && matchDept && matchType && matchExp;
        });
      }, [jobs, searchQuery, selectedDept, selectedType, selectedExp, role]);

      // Saved Jobs List
      const savedJobs = useMemo(() => {
        return jobs.filter(j => savedJobIds.includes(j.id));
      }, [jobs, savedJobIds]);

      // Check if user has applied to a given job
      const hasUserApplied = (jobId) => {
        return applications.some(a => a.jobId === jobId);
      };

      return (
        <div className="min-h-screen flex flex-col bg-brand-50/40">
          
          {/* Toast Notification Container */}
          <div className="fixed top-5 right-5 z-50">
            {toast && (
              <Toast
                message={toast.message}
                type={toast.type}
                onClose={() => setToast(null)}
              />
            )}
          </div>

          {/* Navigation Bar */}
          <Navbar
            role={role}
            setRole={setRole}
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            appCount={applications.length}
            onPostJobClick={() => {
              setEditingJob(null);
              setIsPostModalOpen(true);
            }}
            onResetData={handleResetData}
          />

          {/* Role Banner / Hero */}
          <RoleBanner
            role={role}
            setRole={setRole}
            onPostJobClick={() => {
              setEditingJob(null);
              setIsPostModalOpen(true);
            }}
          />

          {/* Main Content Area */}
          <main className="flex-1">
            
            {/* USER VIEW: Explore Jobs */}
            {role === 'user' && activeTab === 'explore' && (
              <div className="max-w-7xl mx-auto py-8 px-4 sm:px-6">
                
                {/* Search & Filter Controls */}
                <div className="bg-white p-4 sm:p-5 rounded-2xl border border-brand-100 shadow-purple-sm mb-8 space-y-4">
                  <div className="flex flex-col md:flex-row gap-3">
                    
                    {/* Search Input */}
                    <div className="relative flex-1">
                      <IconSearch className="w-5 h-5 text-brand-400 absolute left-3.5 top-3" />
                      <input
                        type="text"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder="Search by job title, company, skills (e.g. React, Figma)..."
                        className="w-full pl-11 pr-4 py-2.5 bg-brand-50/50 rounded-xl border border-brand-100 text-sm outline-none focus:ring-2 focus:ring-brand-400 text-slate-800 placeholder-slate-400 transition"
                      />
                      {searchQuery && (
                        <button
                          onClick={() => setSearchQuery('')}
                          className="absolute right-3 top-3 text-slate-400 hover:text-slate-600"
                        >
                          <IconX className="w-4 h-4" />
                        </button>
                      )}
                    </div>

                    {/* Department Filter */}
                    <div className="flex items-center gap-2">
                      <select
                        value={selectedDept}
                        onChange={(e) => setSelectedDept(e.target.value)}
                        className="px-3.5 py-2.5 bg-brand-50/50 rounded-xl border border-brand-100 text-xs sm:text-sm font-medium text-slate-700 outline-none focus:ring-2 focus:ring-brand-400"
                      >
                        <option value="All">All Departments</option>
                        <option value="Engineering">Engineering</option>
                        <option value="Design">Design</option>
                        <option value="Product">Product</option>
                        <option value="Marketing">Marketing</option>
                      </select>

                      {/* Job Type Filter */}
                      <select
                        value={selectedType}
                        onChange={(e) => setSelectedType(e.target.value)}
                        className="px-3.5 py-2.5 bg-brand-50/50 rounded-xl border border-brand-100 text-xs sm:text-sm font-medium text-slate-700 outline-none focus:ring-2 focus:ring-brand-400"
                      >
                        <option value="All">All Work Types</option>
                        <option value="Remote">Remote</option>
                        <option value="Full-time">Full-time</option>
                        <option value="Hybrid">Hybrid</option>
                        <option value="Contract">Contract</option>
                      </select>

                      {/* Experience Level */}
                      <select
                        value={selectedExp}
                        onChange={(e) => setSelectedExp(e.target.value)}
                        className="hidden sm:block px-3.5 py-2.5 bg-brand-50/50 rounded-xl border border-brand-100 text-xs sm:text-sm font-medium text-slate-700 outline-none focus:ring-2 focus:ring-brand-400"
                      >
                        <option value="All">All Levels</option>
                        <option value="Entry">Entry Level</option>
                        <option value="Mid">Mid Level</option>
                        <option value="Senior">Senior Level</option>
                        <option value="Lead">Lead Level</option>
                      </select>
                    </div>

                  </div>

                  {/* Quick Filters / Pill Shortcuts */}
                  <div className="flex items-center gap-2 flex-wrap text-xs pt-1 border-t border-brand-50">
                    <span className="text-slate-400 font-medium">Quick Filters:</span>
                    <button
                      onClick={() => { setSelectedType('Remote'); setSearchQuery(''); }}
                      className={`px-3 py-1 rounded-full border transition ${
                        selectedType === 'Remote' ? 'bg-brand-600 text-white border-brand-600' : 'bg-brand-50 text-brand-700 border-brand-100 hover:bg-brand-100'
                      }`}
                    >
                      ⚡ Remote Only
                    </button>
                    <button
                      onClick={() => { setSelectedDept('Engineering'); }}
                      className={`px-3 py-1 rounded-full border transition ${
                        selectedDept === 'Engineering' ? 'bg-brand-600 text-white border-brand-600' : 'bg-brand-50 text-brand-700 border-brand-100 hover:bg-brand-100'
                      }`}
                    >
                      💻 Engineering
                    </button>
                    <button
                      onClick={() => { setSelectedDept('Design'); }}
                      className={`px-3 py-1 rounded-full border transition ${
                        selectedDept === 'Design' ? 'bg-brand-600 text-white border-brand-600' : 'bg-brand-50 text-brand-700 border-brand-100 hover:bg-brand-100'
                      }`}
                    >
                      🎨 UI/UX Design
                    </button>
                    <button
                      onClick={() => { setSelectedExp('Senior'); }}
                      className={`px-3 py-1 rounded-full border transition ${
                        selectedExp === 'Senior' ? 'bg-brand-600 text-white border-brand-600' : 'bg-brand-50 text-brand-700 border-brand-100 hover:bg-brand-100'
                      }`}
                    >
                      ⭐ Senior Roles
                    </button>
                    {(selectedDept !== 'All' || selectedType !== 'All' || selectedExp !== 'All' || searchQuery) && (
                      <button
                        onClick={() => {
                          setSelectedDept('All');
                          setSelectedType('All');
                          setSelectedExp('All');
                          setSearchQuery('');
                        }}
                        className="text-xs text-rose-500 hover:underline ml-auto font-medium"
                      >
                        Reset Filters
                      </button>
                    )}
                  </div>
                </div>

                {/* Job Cards Grid */}
                <div className="flex items-center justify-between mb-4">
                  <span className="text-sm font-semibold text-slate-700">
                    Showing {filteredJobs.length} Job Opening{filteredJobs.length !== 1 ? 's' : ''}
                  </span>
                </div>

                {filteredJobs.length === 0 ? (
                  <div className="bg-white rounded-3xl border border-brand-100 p-12 text-center shadow-purple-sm">
                    <IconBriefcase className="w-12 h-12 text-brand-300 mx-auto mb-3" />
                    <h3 className="text-lg font-bold text-slate-800">No matching jobs found</h3>
                    <p className="text-sm text-slate-500 mt-1">
                      Try clearing your search terms or expanding your filter selections.
                    </p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {filteredJobs.map((job) => (
                      <JobCard
                        key={job.id}
                        job={job}
                        onSelect={(j) => setSelectedJobForDetail(j)}
                        onApply={(j) => setSelectedJobForApply(j)}
                        isSaved={savedJobIds.includes(job.id)}
                        onToggleSave={handleToggleSave}
                        hasApplied={hasUserApplied(job.id)}
                      />
                    ))}
                  </div>
                )}

              </div>
            )}

            {/* USER VIEW: My Applications */}
            {role === 'user' && activeTab === 'applications' && (
              <MyApplications
                applications={applications}
                onWithdraw={handleWithdraw}
                onViewDetails={(app) => {
                  const job = jobs.find(j => j.id === app.jobId);
                  if (job) setSelectedJobForDetail(job);
                }}
              />
            )}

            {/* USER VIEW: Saved Jobs */}
            {role === 'user' && activeTab === 'saved' && (
              <div className="max-w-7xl mx-auto py-8 px-4 sm:px-6">
                <div className="mb-6">
                  <h2 className="text-2xl font-bold text-slate-900">Saved Roles</h2>
                  <p className="text-sm text-slate-500 mt-0.5">
                    Roles you've bookmarked for future reference.
                  </p>
                </div>

                {savedJobs.length === 0 ? (
                  <div className="bg-white rounded-3xl border border-brand-100 p-12 text-center shadow-purple-sm">
                    <IconBookmark className="w-12 h-12 text-brand-300 mx-auto mb-3" />
                    <h3 className="text-lg font-bold text-slate-800">No saved roles yet</h3>
                    <p className="text-sm text-slate-500 mt-1">
                      Click the bookmark icon on any job card to save it here.
                    </p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {savedJobs.map((job) => (
                      <JobCard
                        key={job.id}
                        job={job}
                        onSelect={(j) => setSelectedJobForDetail(j)}
                        onApply={(j) => setSelectedJobForApply(j)}
                        isSaved={true}
                        onToggleSave={handleToggleSave}
                        hasApplied={hasUserApplied(job.id)}
                      />
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* ADMIN VIEW: Job Postings */}
            {role === 'admin' && activeTab === 'admin-jobs' && (
              <AdminDashboard
                jobs={jobs}
                applications={applications}
                onOpenPostModal={() => {
                  setEditingJob(null);
                  setIsPostModalOpen(true);
                }}
                onOpenEditModal={(job) => {
                  setEditingJob(job);
                  setIsPostModalOpen(true);
                }}
                onDeleteJob={handleDeleteJob}
                onToggleJobStatus={handleToggleJobStatus}
                onViewApplicantsForJob={(jobId) => {
                  setAdminFilterJobId(jobId);
                  setActiveTab('admin-applicants');
                }}
              />
            )}

            {/* ADMIN VIEW: Candidates (ATS) */}
            {role === 'admin' && activeTab === 'admin-applicants' && (
              <AdminApplicants
                applications={applications}
                jobs={jobs}
                filterJobId={adminFilterJobId}
                setFilterJobId={setAdminFilterJobId}
                onUpdateStatus={handleUpdateApplicantStatus}
                onUpdateNotes={handleUpdateApplicantNotes}
                onDeleteApplicant={handleDeleteApplicant}
              />
            )}

          </main>

          {/* Job Details Modal */}
          <JobDetailModal
            job={selectedJobForDetail}
            onClose={() => setSelectedJobForDetail(null)}
            onApply={(j) => setSelectedJobForApply(j)}
            hasApplied={selectedJobForDetail ? hasUserApplied(selectedJobForDetail.id) : false}
            isSaved={selectedJobForDetail ? savedJobIds.includes(selectedJobForDetail.id) : false}
            onToggleSave={handleToggleSave}
          />

          {/* Apply Modal */}
          <ApplyModal
            job={selectedJobForApply}
            onClose={() => setSelectedJobForApply(null)}
            onSubmitSuccess={handleApplySuccess}
          />

          {/* Admin Post / Edit Job Modal */}
          <PostJobModal
            isOpen={isPostModalOpen}
            onClose={() => {
              setIsPostModalOpen(false);
              setEditingJob(null);
            }}
            onSaveJob={handleSaveJob}
            initialJob={editingJob}
          />

          {/* Footer */}
          <footer className="bg-white border-t border-brand-100 py-6 mt-12 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <div className="w-5 h-5 rounded-lg gradient-purple-btn flex items-center justify-center text-white">
                  <IconBriefcase className="w-3 h-3" />
                </div>
                <span className="font-bold text-slate-800">TalentViolet</span>
                <span>• Job Tracking & Recruitment Portal</span>
              </div>
              <div className="flex items-center gap-4 text-slate-400">
                <span>Theme: Light Purple</span>
                <span>Built with React & Tailwind CSS</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
